<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator | OnThePixel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .hero-bg {
      background: linear-gradient(-45deg, #0f0f23, #1a1a2e, #16213e, #0f3460);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-glow {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-glow:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 15px 12px rgba(0, 0, 0, 0.1);
    }

    .partner-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s ease;
    }

    .partner-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 25px 50px rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body class="min-h-screen bg-gray-900">
  <div class="hero-bg relative min-h-screen flex flex-col items-center justify-center px-4 py-16">
    <div class="text-center mb-12">
      <img id="avatar" src="" alt="" class="w-40 h-40 rounded-2xl mx-auto mb-8 hidden drop-shadow-2xl" style="image-rendering: pixelated;">
      <h1 id="name" class="text-5xl md:text-7xl font-black text-white mb-4 tracking-tight break-all">Lädt…</h1>
      <div class="w-32 h-1 bg-gradient-to-r from-blue-400 to-cyan-400 mx-auto rounded-full"></div>
    </div>

    <div id="links" class="w-full max-w-lg mx-auto space-y-5"></div>
    <p id="error" class="text-gray-300 text-center mt-6 hidden"></p>
  </div>

  <section class="relative py-20 bg-gray-900">
    <div class="max-w-6xl mx-auto px-4">
      <div class="text-center mb-16">
        <h2 class="text-4xl md:text-5xl font-black text-white mb-4">Partner & Sponsoren</h2>
        <div class="w-24 h-1 bg-gradient-to-r from-blue-400 via-cyan-400 to-blue-600 mx-auto rounded-full"></div>
      </div>
      <div class="flex justify-center">
        <a href="https://onthepixel.net" class="partner-card rounded-3xl p-8 block group w-full max-w-md">
          <div class="flex flex-col items-center text-center">
            <div class="bg-gradient-to-br from-cyan-400 to-blue-600 rounded-2xl p-4 mb-6">
              <i class="fas fa-link text-white text-3xl"></i>
            </div>
            <h3 class="text-2xl font-bold text-white mb-3 group-hover:text-cyan-400 transition-colors">OnThePixel.net</h3>
            <p class="text-gray-300 leading-relaxed mb-6">Offizieller Partner für Gaming-Events und Community-Aktivitäten</p>
            <div class="flex items-center text-cyan-400 font-medium group-hover:text-white transition-colors">
              <span>Partner Website besuchen</span>
              <i class="fas fa-arrow-right ml-2"></i>
            </div>
          </div>
        </a>
      </div>
    </div>
  </section>

  <footer class="bg-black py-12">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <p class="text-gray-400 text-sm">© 2025 OnThePixel.net</p>
        <p class="text-gray-500 text-xs">OTP.cx is a domain by OnThePixel.net</p>
      </div>
      <a href="https://onthepixel.net/imprint" class="text-gray-400 hover:text-white text-sm transition-colors">Impressum</a>
    </div>
  </footer>

  <script>
    const API_URL = 'https://onthepixel.net/api/creators';

    // Icon Name aus der API -> Anzeige
    const PLATFORMS = {
      twitch:    { label: 'Twitch',    text: 'Live Streams',     icon: 'fab fa-twitch',    color: 'bg-[#9146FF]' },
      youtube:   { label: 'YouTube',   text: 'Videos',           icon: 'fab fa-youtube',   color: 'bg-red-600' },
      discord:   { label: 'Discord',   text: 'Community Chat',   icon: 'fab fa-discord',   color: 'bg-[#5865F2]' },
      tiktok:    { label: 'TikTok',    text: 'Clips',            icon: 'fab fa-tiktok',    color: 'bg-black' },
      instagram: { label: 'Instagram', text: 'Fotos & Stories',  icon: 'fab fa-instagram', color: 'bg-gradient-to-br from-purple-600 to-pink-500' },
      whatsapp:  { label: 'WhatsApp',  text: 'Kanal',            icon: 'fab fa-whatsapp',  color: 'bg-green-600' },
      x_twitter: { label: 'X',         text: 'Posts',            icon: 'fab fa-x-twitter', color: 'bg-gray-800' },
    };

    function showError(msg) {
      document.getElementById('name').textContent = 'Nicht gefunden';
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function renderLink({ Icons, Link }) {
      const p = PLATFORMS[Icons] || { label: Icons, text: '', icon: 'fas fa-link', color: 'bg-gray-700' };
      const a = document.createElement('a');
      a.href = Link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'btn-glow glass-card rounded-2xl p-5 flex items-center justify-between group';
      a.innerHTML = `
        <div class="flex items-center gap-4">
          <div class="${p.color} w-12 h-12 rounded-xl flex items-center justify-center">
            <i class="${p.icon} text-white text-xl"></i>
          </div>
          <div>
            <h3 class="text-white font-semibold text-lg"></h3>
            <p class="text-gray-300 text-sm"></p>
          </div>
        </div>
        <div class="bg-white/20 rounded-full w-10 h-10 flex items-center justify-center group-hover:bg-white/30 transition-all">
          <i class="fas fa-external-link-alt text-white"></i>
        </div>`;
      a.querySelector('h3').textContent = p.label;
      a.querySelector('p').textContent = p.text;
      return a;
    }

    async function load() {
      const wanted = (new URLSearchParams(location.search).get('name') || location.hash.slice(1)).toLowerCase();
      if (!wanted) return showError('Kein Creator angegeben. Beispiel: creator.html?name=Sanherib');

      let creators;
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(res.status);
        creators = (await res.json()).data || [];
      } catch (e) {
        return showError('Die Creator Daten konnten nicht geladen werden.');
      }

      const c = creators.find(c => c.Name.toLowerCase() === wanted);
      if (!c) return showError(`Es gibt keinen Creator mit dem Namen "${wanted}".`);

      document.title = `${c.Name} | OnThePixel`;
      document.getElementById('name').textContent = c.Name;

      if (c.Minecraft_username) {
        const img = document.getElementById('avatar');
        img.src = `https://api.mcskin.me/pfp/${encodeURIComponent(c.Minecraft_username)}?size=256`;
        img.alt = c.Name;
        img.onerror = () => { img.onerror = null; img.src += '&retry=1'; };
        img.classList.remove('hidden');
      }

      const list = document.getElementById('links');
      (c.Platforms || []).forEach(p => list.appendChild(renderLink(p)));
    }

    load();
  </script>
</body>
</html>
